<div class="o_versions dropdown d-none d-sm-block">
    <button
        type="button"
        id="versions"
        class="btn d-inline-flex align-items-center gap-1 text-nowrap"
        {{- ' data-bs-toggle="dropdown"' if alternate_versions else ' disabled=""' }}
        aria-expanded="false"
    >
        {{- version_display_name }} {# The current version #}
        <i class="o_icon" data-icon="expand_more" aria-hidden="true"></i>
    </button>
    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="versions">
        {%- for alternate_version, url in alternate_versions %}
            <li><a class="o_switcher_item dropdown-item" href="{{ url }}">{{ alternate_version }}</a></li>
        {%- endfor %}
    </ul>
</div>
