{# NOTE: the 'searchbox' id is used to hook the "Hide Search Matches" button #}
<div id="searchbox" class="o_search_wrapper flex-grow-1 mx-auto" role="search">
    <form class="o_search" action="{{ pathto('search') }}" method="get">
        <input type="text" name="q" id="q" class="form-control rounded-pill" placeholder="{{ _('What are you looking for?') }}">
        <input type="hidden" name="area" value="default">
        <input type="hidden" name="check_keywords" value="yes">
        <button type="submit" class="btn" aria-label="{{ _('Search') }}">
            <i class="o_icon" data-icon="search" aria-hidden="true"></i>
        </button>
    </form>
</div>
<script type="text/javascript">document.querySelector('.o_search_wrapper').hidden = false;</script>
