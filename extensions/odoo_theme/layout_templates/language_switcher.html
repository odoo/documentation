<div class="o_languages dropdown">
    <button
        type="button"
        id="languages"
        class="o_icon_button btn"
        title="{{ language }}" {# The current language #}
        {{- ' data-bs-toggle="dropdown"' if alternate_languages else ' disabled=""' }}
        aria-label="{{ language }}"
        aria-expanded="false"
    >
        <i class="o_icon" data-icon="language" aria-hidden="true"></i>
    </button>
    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="languages">
        {%- for alternate_language, language_code, url in alternate_languages %}
            <li><a class="o_switcher_item dropdown-item" href="{{ url }}">{{ alternate_language }}</a></li>
        {%- endfor %}
    </ul>
</div>
